name: Build Clinic APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Android
        uses: android-actions/setup-android@v3

      - name: إنشاء ملفات التطبيق
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/clinic/system
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ClinicSystem"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.clinic.system'
              compileSdk 35

              defaultConfig {
                  applicationId "com.clinic.system"
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName "2.0"
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.14.0'
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#0878B8</item>
                  <item name="android:navigationBarColor">#F4F8FA</item>
                  <item name="android:statusBarColor">#0878B8</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_clinic.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#0878B8"
                  android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M45,20L63,20L63,45L88,45L88,63L63,63L63,88L45,88L45,63L20,63L20,45L45,45Z" />

          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="نظام إدارة العيادة"
                  android:icon="@drawable/ic_clinic"
                  android:roundIcon="@drawable/ic_clinic"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/clinic/system/MainActivity.java <<'EOF'
          package com.clinic.system;

          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Handler;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  showSplash();

                  new Handler().postDelayed(() -> {
                      openClinic();
                  }, 1200);
              }

              private void showSplash() {

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setBackgroundColor(Color.rgb(244, 248, 250));

                  TextView icon = new TextView(this);
                  icon.setText("✚");
                  icon.setTextSize(70);
                  icon.setTextColor(Color.WHITE);
                  icon.setGravity(Gravity.CENTER);
                  icon.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  icon.setBackgroundColor(Color.rgb(8, 120, 184));

                  LinearLayout.LayoutParams iconParams =
                          new LinearLayout.LayoutParams(180, 180);

                  iconParams.gravity = Gravity.CENTER;
                  layout.addView(icon, iconParams);

                  TextView title = new TextView(this);
                  title.setText("نظام إدارة العيادة");
                  title.setTextSize(25);
                  title.setTextColor(Color.rgb(8, 70, 105));
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);

                  LinearLayout.LayoutParams titleParams =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT
                          );

                  titleParams.setMargins(0, 35, 0, 10);
                  layout.addView(title, titleParams);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("إدارة المرضى والمواعيد بسهولة");
                  subtitle.setTextSize(16);
                  subtitle.setTextColor(Color.DKGRAY);
                  subtitle.setGravity(Gravity.CENTER);

                  layout.addView(subtitle);

                  setContentView(layout);
              }

              private void openClinic() {

                  webView = new WebView(this);
                  setContentView(webView);

                  webView.setBackgroundColor(Color.WHITE);
                  webView.setWebViewClient(new WebViewClient());

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setDatabaseEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowContentAccess(true);

                  webView.loadUrl(
                      "https://mm6384231-ship-it.github.io/clinic-system/"
                  );
              }

              @Override
              public void onBackPressed() {

                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: إنشاء Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x gradlew

      - name: بناء APK
        run: |
          ./gradlew assembleDebug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: ClinicSystem-APK
          path: app/build/outputs/apk/debug/app-debug.apk
